name: Assemble changelog

# Feature branches add their own file under changelog.d/ instead of writing to
# the top of CHANGELOG.md, which is what stops two open branches conflicting.
# This folds those fragments in on main, where there is no parallel branch to
# conflict with. The script and the job both live in the foundation — see the
# changelog section of its README.
#
# If the push is ever rejected, it is branch protection: the Actions bot needs
# to be on this branch's ruleset bypass list. Re-run this from the Actions tab
# once that is set.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble:
    uses: blueworx-io/bluegroup_core_foundation/.github/workflows/assemble-changelog.yml@v1
    with:
      # This plugin's version of record is the header in the main plugin file,
      # the same source the version bump check reads.
      version_source: plugin-header
      foundation_ref: v1
    permissions:
      contents: write
