name: CI
on: pull_request
jobs:
  guardrails:
    uses: blueworx-io/bluegroup_core_foundation/.github/workflows/ci-wordpress.yml@v1.4.0
    with:
      plugin_slug: blueworx-labs-wordpress
      # Provision a disposable WordPress on the runner rather than pointing at a
      # staging host. See docs/wordpress-test-harness.md in the foundation.
      use_local_wordpress: true
      # The suite is long enough that it, not the static checks, sets how long a
      # PR takes. Each shard is its own runner with its own WordPress, which is
      # what makes this safe — the specs mutate site-wide state, so they must
      # never share one site. Do NOT raise `workers` in playwright.config.js to
      # chase the same win; that shares the site and corrupts runs.
      #
      # Playwright shards by spec FILE here (fullyParallel is false), so the
      # slowest single file is the floor — more shards than this buys nothing
      # until the big spec files are split up.
      shards: 3
      # This plugin moves the login screen off wp-login.php, which 301s away.
      # Without this every admin spec fails at the sign-in step.
      wp_login_path: admin_login
      # Pin the check scripts to the same release as the workflow above. This
      # input defaults to `main`, so without it the pinned workflow would run
      # against whatever is on the foundation's main branch today.
      #
      # Pinned to an exact release rather than the moving `v1` tag on purpose.
      # `v1` still points at 1 August, before the shared admin design system
      # existed, and moving it would switch these checks on for every plugin at
      # once — including ones whose copy of the design system has drifted. This
      # plugin goes first; `v1` catches up once the others are ready.
      #
      # Bump this whenever the design system changes upstream: the sync check
      # compares our copy against the foundation AT THIS REF, so a component
      # added upstream and copied here fails until the ref moves with it.
      foundation_ref: v1.12.0
      # Our design system copy matches the foundation, so the sync check stays
      # strict (its default). Adherence is the one we cannot pass yet: the admin
      # re-skin is still hand-styled, and the components we invented for it are
      # deliberately local, which reads as off-system. `warn` prints the report
      # without blocking a merge. Remove it once the re-skin is on the system.
      admin_ui_adherence: warn
      # The shared exclude list deliberately keeps `scripts/` shippable, because
      # plenty of plugins keep runtime JS there. This one does not: what ships is
      # the allowlist in scripts/build-zip.mjs — the plugin file, uninstall.php,
      # readme.txt, includes/, assets/, languages/ — and nothing under scripts/
      # is read at runtime by WordPress. Excluding the directory also stops every
      # future *.test.mjs next to a build script from failing the zip check.
      exclude_paths: |
        /scripts
        # The vendored update checker is shipped whole, exactly as upstream
        # publishes it, so it can be swapped for a newer version by replacing the
        # folder. Its composer.json is the one file in it the zip check refuses —
        # Composer never runs on a site, so it is left out of the zip rather than
        # deleted out of the library.
        /plugin-update-checker/composer.json
    secrets: inherit
